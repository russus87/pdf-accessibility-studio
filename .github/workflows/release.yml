# Compila e pubblica i pacchetti desktop per Linux, Windows e macOS.
# Si attiva spingendo un tag tipo v0.1.0 (oppure manualmente da GitHub).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Mac Apple Silicon
            args: "--target aarch64-apple-darwin"
            pdfium_os: mac
            pdfium_arch: arm64
          - platform: ubuntu-22.04      # Linux (.deb, .rpm, .AppImage)
            args: ""
            pdfium_os: linux
            pdfium_arch: x64
          - platform: windows-latest    # Windows (.exe NSIS, .msi)
            args: ""
            pdfium_os: win
            pdfium_arch: x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Dipendenze di sistema (solo Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Scarica la libreria nativa Pdfium nella cartella che Tauri impacchetta
      # come risorsa (src-tauri/pdfium). A runtime l'app la cerca li'.
      - name: Pdfium
        shell: bash
        env:
          PDFIUM_OS: ${{ matrix.pdfium_os }}
          PDFIUM_ARCH: ${{ matrix.pdfium_arch }}
        run: bash scripts/fetch-pdfium.sh src-tauri/pdfium

      - name: Installa dipendenze frontend
        run: npm install

      - name: Build + bundle + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma gli artefatti di aggiornamento (createUpdaterArtifacts in tauri.conf).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PDF Accessibility Studio ${{ github.ref_name }}"
          releaseDraft: true
          releaseBody: "Pacchetti generati automaticamente. .pkg.tar.zst per Arch Linux."
          args: ${{ matrix.args }}

  # --- Arch Linux: pacchetto nativo .pkg.tar.zst via makepkg ---
  arch:
    runs-on: ubuntu-latest
    needs: build              # la release (draft) esiste gia', creata dal job build
    permissions:
      contents: write
    container:
      image: archlinux:latest
    steps:
      - name: Strumenti base nel container
        run: pacman -Syu --noconfirm git nodejs npm rust base-devel webkit2gtk-4.1 gtk3 librsvg sudo curl

      - uses: actions/checkout@v4

      - name: Inietta la versione dal tag nel PKGBUILD
        run: |
          VER="${GITHUB_REF_NAME#v}"        # v0.1.0 -> 0.1.0
          sed -i "s/^pkgver=.*/pkgver=${VER}/" packaging/PKGBUILD
          echo "Versione pacchetto: ${VER}"

      - name: Build del pacchetto (makepkg non gira da root)
        run: |
          useradd -m builder
          chown -R builder:builder .
          sudo -u builder bash -c 'cd packaging && makepkg -f --noconfirm --nodeps'

      - name: Carica il .pkg.tar.zst nella release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: packaging/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Pubblica gli artefatti (e l'auto-update) sul repo pubblico -dist ---
  # continue-on-error: senza il secret DIST_TOKEN questo job fallisce ma non deve
  # invalidare la release principale (gli altri artefatti restano disponibili).
  pubblica-dist:
    runs-on: ubuntu-latest
    needs: [build, arch]
    continue-on-error: true
    steps:
      - name: Scarica gli asset dalla release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dist-assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --dir dist-assets

      - name: Riscrivi gli URL di latest.json verso il repo pubblico
        run: |
          cd dist-assets
          if [ -f latest.json ]; then
            sed -i 's#/russus87/pdf-accessibility-studio/releases#/russus87/pdf-accessibility-studio-dist/releases#g' latest.json
            echo "latest.json aggiornato:"; cat latest.json
          else
            echo "ATTENZIONE: latest.json non trovato"; ls -la
          fi

      - name: Pubblica su pdf-accessibility-studio-dist
        env:
          GH_TOKEN: ${{ secrets.DIST_TOKEN }}
        run: |
          cd dist-assets
          gh release create "${GITHUB_REF_NAME}" --repo russus87/pdf-accessibility-studio-dist \
            --title "PDF Accessibility Studio ${GITHUB_REF_NAME}" \
            --notes "Artefatti e aggiornamenti automatici." \
            ./* \
          || gh release upload "${GITHUB_REF_NAME}" --repo russus87/pdf-accessibility-studio-dist --clobber ./*
