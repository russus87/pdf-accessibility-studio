[package]
name = "pdf-accessibility-studio"
version = "1.15.0"
description = "PDF Accessibility Studio - visore e validatore di PDF accessibili"
authors = ["Antonio Russo"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pdfa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# La logica vera (apertura/rendering PDF) vive nel crate "core".
pdfa-core = { path = "../core" }
# Le pagine renderizzate vengono inviate alla UI come PNG in base64.
base64 = "0.22"
# Client HTTP per le chiamate all'API Claude (suggerimento Alt con AI) e per il
# download del motore vocale Piper e dei suoi modelli.
# native-tls: usa OpenSSL su Linux, schannel su Windows, Secure Transport su mac
# (niente cmake/nasm da configurare in CI).
reqwest = { version = "0.12", features = ["json"] }
# Estrazione del bundle Piper (tar.gz) scaricato a runtime.
flate2 = "1"
tar = "0.4"

# Su Windows il bundle Piper e' uno ZIP: serve un estrattore solo li'.
[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
