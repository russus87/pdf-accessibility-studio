# Crate "core": tutta la logica riutilizzabile sui PDF (apertura, rendering,
# in futuro validazione accessibilita', confronto, export dei tag).
# Non dipende da Tauri, cosi' potra' servire anche un eventuale backend web.
[package]
name = "pdfa-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Wrapper idiomatico su Pdfium: rendering pagine, estrazione testo, introspezione.
# "thread_safe" serializza le chiamate cosi' possiamo tenere Pdfium in uno stato
# globale condiviso tra i thread di Tauri. "image" espone le pagine come immagini.
pdfium-render = { version = "0.9", features = ["thread_safe", "image_025"] }
# Codifica PNG delle pagine renderizzate da mandare alla UI.
image = { version = "0.25", default-features = false, features = ["png"] }
# Parser PDF a basso livello: structure tree / tag (validazione, confronto, export).
lopdf = "0.41"
# Diff testuale per il confronto tra PDF.
similar = "2"
# Generazione del report di confronto in PDF (font built-in, niente font esterni).
printpdf = "0.9"
# Export dei tag in JSON e codifica base64 delle immagini di diff.
serde_json = "1"
base64 = "0.22"
# Motore di template per generare PDF da modello HTML con variabili, flussi
# ({{#each}}) e condizioni ({{#if}}) alimentati da dati JSON.
handlebars = "6"
# Parsing del font incorporato (glifi, larghezze, cmap) per generare il PDF
# taggato con un layer di testo invisibile e ToUnicode estraibile.
ttf-parser = "0.25"

[dev-dependencies]
tempfile = "3"
